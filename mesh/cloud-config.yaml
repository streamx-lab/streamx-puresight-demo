---
global:
  services:
    edge:
      web-server-sink:
        stateful: true
        replicas: 1
      search-sink:
        volumes:
          opensearch-data: 21Gi
        serviceUnits:
          count: 2.0
        stateful: true
        replicas: 1
clusters:
  eu-west-gra-edge:
    enabled: false
    overlay: {}
  eu-west-gra-processing:
    enabled: true
    overlay: {}
  us-east-chi-edge:
    enabled: true
    overlay: {}
  eu-west-gva-edge:
    enabled: false
    overlay: {}
  ca-east-bhs-edge:
    enabled: true
    overlay: {}
