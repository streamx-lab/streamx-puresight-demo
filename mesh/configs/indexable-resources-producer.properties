# XPath field extraction requires producer >= 3.0.22. Keep fragment indexing enabled.
streamx.blueprints.indexable-resources-producer.index-fragments=true

# EDS conventions: see streamx-eds-puresight-demo-source/helix-query.yaml.
# Map the site's date and read-time names to the Search API field names.
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.image.facet=false
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.image.element-selector=//*[local-name()='meta'][@property='og:image']
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.image.key=image
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.image.value-selector=./@content
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.image.value-processors[0].name=trim

streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.author.facet=false
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.author.element-selector=//*[local-name()='meta'][@name='author']
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.author.key=author
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.author.value-selector=./@content
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.author.value-processors[0].name=trim

streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.publication_date.facet=false
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.publication_date.element-selector=//*[local-name()='meta'][@name='date']
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.publication_date.key=publication_date
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.publication_date.value-selector=./@content
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.publication_date.value-processors[0].name=trim

streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.read_time.facet=false
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.read_time.element-selector=//*[local-name()='meta'][@name='read-time']
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.read_time.key=read_time
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.read_time.value-selector=./@content
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.read_time.value-processors[0].name=trim

# Same facet extraction and processors as the RSS Search demo.
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.facet=true
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.element-selector=//*[local-name()='meta'][starts-with(@property, 'facets:')]
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.key-selector=./@property
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.value-selector=./@content
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.key-processors[0].name=trim
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.key-processors[1].name=lowercase
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.key-processors[2].name=removeStart
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.key-processors[2].config=facets:
streamx.blueprints.indexable-resources-producer.search-feed-extractor.xpath.fields.eds.value-processors[0].name=trim
